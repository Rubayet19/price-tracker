<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Toggle pricing fixture with monthly active by default and annual features that mention per-month usage."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Default Monthly Toggle Fixture</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #050816;
        color: #fff;
      }

      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 48px 24px 64px;
      }

      .toggle {
        display: flex;
        gap: 12px;
        margin-bottom: 32px;
      }

      .toggle button {
        border: 1px solid #1f2937;
        border-radius: 999px;
        padding: 10px 18px;
        cursor: pointer;
        background: #111827;
        color: #cbd5e1;
        font-size: 16px;
      }

      .toggle button.active {
        border-color: #22c55e;
        color: #fff;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px;
      }

      .card {
        border: 1px solid #334155;
        border-radius: 20px;
        padding: 28px;
        min-height: 280px;
        background: linear-gradient(180deg, #111827 0%, #020617 100%);
      }

      .card h2 {
        margin: 0 0 12px;
        font-size: 40px;
        line-height: 1;
      }

      .description {
        margin: 0 0 28px;
        color: #94a3b8;
        font-size: 18px;
      }

      .price-row {
        display: flex;
        align-items: baseline;
        gap: 10px;
        min-height: 64px;
      }

      .price {
        font-size: 56px;
        font-weight: 700;
        line-height: 1;
      }

      .period {
        color: #cbd5e1;
        font-size: 18px;
      }

      .billing-note {
        margin-top: 10px;
        color: #cbd5e1;
      }

      ul {
        padding-left: 24px;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <section id="pricing" aria-label="Pricing">
        <div class="toggle">
          <button
            id="monthly-button"
            class="active"
            type="button"
            aria-pressed="true"
          >
            Monthly
          </button>
          <button id="yearly-button" type="button" aria-pressed="false">
            Yearly
          </button>
        </div>

        <div class="grid">
          <article class="card" data-plan="free-trial">
            <h2>Free Trial</h2>
            <p class="description">Try the full experience</p>

            <div class="state state-monthly">
              <div class="price-row">
                <span class="price">$0</span>
              </div>
            </div>

            <div class="state state-yearly hidden">
              <div class="price-row">
                <span class="price">$0</span>
              </div>
            </div>

            <ul>
              <li>Up to 2 CPU / 8 GB RAM</li>
              <li>30 GB persistent storage</li>
              <li>10 hours or 7 days</li>
            </ul>
          </article>

          <article class="card" data-plan="pro">
            <h2>Pro</h2>
            <p class="description">Your dev environment, everywhere</p>

            <div class="state state-monthly">
              <div class="price-row">
                <span class="price">$29.99</span>
                <span class="period">/month</span>
              </div>
            </div>

            <div class="state state-yearly hidden">
              <div class="price-row">
                <span class="price">$300.00</span>
                <span class="period">/year</span>
              </div>
            </div>

            <ul>
              <li>Up to 2 CPU / 8 GB RAM</li>
              <li>30 GB persistent storage</li>
              <li>120 hours/month</li>
            </ul>
          </article>
        </div>
      </section>
    </main>

    <script>
      const monthlyButton = document.getElementById("monthly-button");
      const yearlyButton = document.getElementById("yearly-button");

      function setCadence(mode) {
        document.querySelectorAll(".state-monthly").forEach((node) => {
          node.classList.toggle("hidden", mode !== "monthly");
        });
        document.querySelectorAll(".state-yearly").forEach((node) => {
          node.classList.toggle("hidden", mode !== "yearly");
        });
        monthlyButton.classList.toggle("active", mode === "monthly");
        yearlyButton.classList.toggle("active", mode === "yearly");
        monthlyButton.setAttribute(
          "aria-pressed",
          mode === "monthly" ? "true" : "false"
        );
        yearlyButton.setAttribute(
          "aria-pressed",
          mode === "yearly" ? "true" : "false"
        );
      }

      monthlyButton.addEventListener("click", () => setCadence("monthly"));
      yearlyButton.addEventListener("click", () => setCadence("yearly"));
      setCadence("monthly");
    </script>
  </body>
</html>
