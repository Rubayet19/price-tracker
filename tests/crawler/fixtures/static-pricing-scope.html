<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Acme Pricing</title>
    <meta
      name="description"
      content="Simple monthly pricing for growing teams."
    />
  </head>
  <body>
    <header>
      <nav>
        <h2>Connect</h2>
        <h2>Legal</h2>
        <h2>iOS</h2>
        <a href="/docs">Docs</a>
      </nav>
    </header>

    <main>
      <section id="hero">
        <h1>Simple pricing</h1>
        <p>Choose the plan that matches your stage.</p>
      </section>

      <section class="pricing-section">
        <div class="pricing-grid">
          <article>
            <h3>Starter</h3>
            <div class="price">$12</div>
            <span>per month</span>
            <button>Get started</button>
          </article>

          <article>
            <h3>Pro</h3>
            <div class="price">$29</div>
            <span>per month</span>
            <button>Get started</button>
          </article>
        </div>
      </section>
    </main>

    <footer>
      <h4>Android</h4>
      <h4>Resources</h4>
    </footer>
  </body>
</html>
