<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Toggle pricing fixture with a CTA that should not be mistaken for a cookie dismiss button."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toggle Pricing CTA Modal Fixture</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #050816;
        color: #fff;
      }

      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 48px 24px 64px;
      }

      .hero {
        margin-bottom: 28px;
      }

      .hero button {
        border: 0;
        border-radius: 999px;
        padding: 12px 20px;
        cursor: pointer;
        background: #1d4ed8;
        color: #fff;
      }

      .toggle {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin-bottom: 32px;
      }

      .toggle button {
        border: 0;
        border-radius: 999px;
        padding: 10px 18px;
        cursor: pointer;
        background: #1f2937;
        color: #cbd5e1;
        font-size: 16px;
      }

      .toggle button.active {
        background: #2563eb;
        color: #fff;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px;
      }

      .card {
        border: 1px solid #334155;
        border-radius: 20px;
        padding: 28px;
        min-height: 280px;
        background: linear-gradient(180deg, #111827 0%, #020617 100%);
      }

      .card h2 {
        margin: 0 0 12px;
        font-size: 40px;
        line-height: 1;
      }

      .description {
        margin: 0 0 28px;
        color: #94a3b8;
        font-size: 18px;
      }

      .price-row {
        display: flex;
        align-items: baseline;
        gap: 10px;
        min-height: 64px;
      }

      .price {
        font-size: 56px;
        font-weight: 700;
        line-height: 1;
      }

      .period {
        color: #cbd5e1;
        font-size: 18px;
      }

      .was-price {
        color: #f87171;
        font-size: 24px;
        text-decoration: line-through;
      }

      .billing-note {
        margin-top: 10px;
        color: #cbd5e1;
      }

      .cta {
        margin-top: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 180px;
        border-radius: 12px;
        padding: 14px 20px;
        background: #3b82f6;
        color: #fff;
        text-decoration: none;
      }

      .hidden {
        display: none;
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 999;
        background: rgba(0, 0, 0, 0.5);
      }

      .modal {
        position: fixed;
        top: 20%;
        left: 50%;
        z-index: 1000;
        transform: translateX(-50%);
        width: min(420px, calc(100vw - 32px));
        border-radius: 16px;
        border: 1px solid #334155;
        background: #111827;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <button id="demo-button" type="button">Book A Demo</button>
      </section>

      <section aria-label="Pricing">
        <div class="toggle">
          <button id="monthly-button" type="button">Monthly</button>
          <button id="annual-button" class="active" type="button">Annual</button>
        </div>

        <div class="grid">
          <article class="card" data-plan="starter">
            <h2>Starter</h2>
            <p class="description">For solo creators getting started</p>

            <div class="state state-monthly hidden">
              <div class="price-row">
                <span class="price">$19.99</span>
                <span class="period">/month</span>
              </div>
            </div>

            <div class="state state-annual">
              <div class="price-row">
                <span class="was-price">$20.00</span>
                <span class="price">$9.00</span>
                <span class="period">/month</span>
              </div>
              <p class="billing-note">Billed for 12 months</p>
            </div>

            <a class="cta" href="#start">Start Trial</a>
          </article>
        </div>
      </section>
    </main>

    <template id="demo-modal-template">
      <div class="modal-backdrop" data-state="open" aria-hidden="true"></div>
      <div class="modal" data-state="open" role="alertdialog">
        <p>Book a demo with our team</p>
        <button type="button">Cancel</button>
      </div>
    </template>

    <script>
      const monthlyButton = document.getElementById("monthly-button");
      const annualButton = document.getElementById("annual-button");
      const demoButton = document.getElementById("demo-button");
      const modalTemplate = document.getElementById("demo-modal-template");

      function setCadence(mode) {
        document.querySelectorAll(".state-monthly").forEach((node) => {
          node.classList.toggle("hidden", mode !== "monthly");
        });
        document.querySelectorAll(".state-annual").forEach((node) => {
          node.classList.toggle("hidden", mode !== "annual");
        });
        monthlyButton.classList.toggle("active", mode === "monthly");
        annualButton.classList.toggle("active", mode === "annual");
      }

      demoButton.addEventListener("click", () => {
        document.body.appendChild(modalTemplate.content.cloneNode(true));
      });

      monthlyButton.addEventListener("click", () => setCadence("monthly"));
      annualButton.addEventListener("click", () => setCadence("annual"));
      setCadence("annual");
    </script>
  </body>
</html>
